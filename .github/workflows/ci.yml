name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 24
    steps:
      # Full history, so the commit a release receipt names is present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: npm test
      # The counts a release receipt states must be the same on every OS and
      # Node.js version, so print them from the TAP output here.
      - name: Count the tests
        run: |
          node --test --test-reporter=tap test/*.test.js > "$RUNNER_TEMP/tests.tap"
          TAP_FILE="$RUNNER_TEMP/tests.tap" node --input-type=module -e '
            import fs from "node:fs";
            import { parseTap } from "./src/tap.js";
            const result = parseTap(fs.readFileSync(process.env.TAP_FILE, "utf8"));
            if (!result.counts) { console.error(result.problem); process.exit(1); }
            console.log(`leaf tests: ${JSON.stringify(result.counts)}`);
          '
      - name: Verify the release receipts
        run: |
          found=0
          for receipt in receipts/*.json; do
            [ -e "$receipt" ] || continue
            found=1
            echo "== $receipt"
            node bin/receipt-check.js verify "$receipt"
          done
          [ "$found" = 1 ] || echo "No release receipts yet."
